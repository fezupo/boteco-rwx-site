name: Collect Boteco Analytics (Free Runner)

on:
  workflow_dispatch:
  schedule:
    # 08:17, 10:17, 12:17, 14:17, 16:17, 18:17 and 20:17 America/Sao_Paulo.
    - cron: '17 11,13,15,17,19,21,23 * * *'

permissions:
  contents: read

concurrency:
  group: boteco-rwx-analytics-free-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check free-runner configuration
        id: config
        env:
          ANALYTICS_REPO_TOKEN: ${{ secrets.ANALYTICS_REPO_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -n "$ANALYTICS_REPO_TOKEN" ] && [ -n "$YT_CLIENT_ID" ] && [ -n "$YT_CLIENT_SECRET" ] && [ -n "$YT_REFRESH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Free analytics runner is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Free analytics runner is waiting for repository secrets; skipping without failure."
          fi

      - name: Configuration pending
        if: steps.config.outputs.ready != 'true'
        run: echo "Nothing to do yet. No private hosted-runner minutes were consumed."

      - name: Checkout private analytics repository
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: fezupo/boteco-rwx-analytics
          token: ${{ secrets.ANALYTICS_REPO_TOKEN }}
          path: analytics
          fetch-depth: 0

      - name: Set up Python
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        working-directory: analytics
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Collect analytics
        if: steps.config.outputs.ready == 'true'
        working-directory: analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python collector/youtube_analytics_collector.py

      - name: Validate generated snapshot
        if: steps.config.outputs.ready == 'true'
        working-directory: analytics
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          latest = Path("latest.json")
          data = json.loads(latest.read_text(encoding="utf-8"))

          if data.get("schema_version") != 1:
              raise SystemExit("Unexpected snapshot schema version")
          if not data.get("channel", {}).get("id"):
              raise SystemExit("YouTube channel id is missing")
          if not isinstance(data.get("videos"), list):
              raise SystemExit("Snapshot videos field is invalid")

          raw_utc = data.get("collected_at_utc")
          raw_local = data.get("collected_at")
          if not raw_utc or not raw_local:
              raise SystemExit("Snapshot timestamps are missing")

          collected_utc = datetime.fromisoformat(raw_utc.replace("Z", "+00:00"))
          age_seconds = (datetime.now(timezone.utc) - collected_utc).total_seconds()
          if age_seconds < -60 or age_seconds > 300:
              raise SystemExit(f"Generated snapshot has invalid age: {age_seconds:.1f}s")

          collected_local = datetime.fromisoformat(raw_local)
          snapshot_path = (
              Path("snapshots")
              / collected_local.strftime("%Y/%m/%d")
              / f'{collected_local.strftime("%Y-%m-%dT%H-%M-%S%z")}.json'
          )
          if not snapshot_path.is_file():
              raise SystemExit(f"Historical snapshot was not created: {snapshot_path}")
          if snapshot_path.read_bytes() != latest.read_bytes():
              raise SystemExit("latest.json differs from historical snapshot")

          print(f"Snapshot validation: OK ({snapshot_path})")
          PY

      - name: Commit snapshot to private analytics repository
        if: steps.config.outputs.ready == 'true'
        working-directory: analytics
        run: |
          git config user.name "boteco-rwx-analytics-bot"
          git config user.email "boteco-rwx-analytics-bot@users.noreply.github.com"
          git add latest.json snapshots/

          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi

          git commit -m "analytics: snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Snapshot push failed after 3 attempts."
          exit 1
