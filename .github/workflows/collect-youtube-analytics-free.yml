name: Collect Boteco Analytics (Free Runner)

on:
  workflow_dispatch:
  schedule:
    # Hourly health checks from 08:23 through 20:23 America/Sao_Paulo.
    # The freshness gate below limits actual collection to roughly every 2 hours.
    - cron: '23 11-23 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/collect-youtube-analytics-free.yml'

permissions:
  contents: read

concurrency:
  group: boteco-rwx-analytics-free-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate executor secrets
        shell: bash
        env:
          ANALYTICS_REPO_TOKEN: ${{ secrets.ANALYTICS_REPO_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANALYTICS_REPO_TOKEN YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

          echo "Executor secrets: OK. Values were not printed."

      - name: Checkout private analytics repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fezupo/boteco-rwx-analytics
          ref: main
          token: ${{ secrets.ANALYTICS_REPO_TOKEN }}
          path: analytics
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Decide whether collection is due
        id: freshness
        shell: bash
        working-directory: analytics
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          should_collect = event != "schedule"
          reason = f"event={event}"

          if event == "schedule":
              now_utc = datetime.now(timezone.utc)
              brt = timezone(timedelta(hours=-3), "BRT")
              now_brt = now_utc.astimezone(brt)
              in_window = 7 <= now_brt.hour <= 21
              age_minutes = float("inf")

              try:
                  data = json.loads(Path("latest.json").read_text(encoding="utf-8"))
                  raw = data.get("collected_at_utc") or data.get("collected_at")
                  if not raw:
                      raise ValueError("snapshot timestamp is missing")
                  collected = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  if collected.tzinfo is None:
                      collected = collected.replace(tzinfo=timezone.utc)
                  age_minutes = max(
                      0,
                      (now_utc - collected.astimezone(timezone.utc)).total_seconds() / 60,
                  )
                  reason = f"in_window={in_window}, snapshot_age={age_minutes:.1f}m"
              except Exception as exc:
                  reason = f"latest.json invalid ({exc}); force collection"

              should_collect = in_window and age_minutes >= 100

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_collect={str(should_collect).lower()}\n")
              output.write(f"reason={reason}\n")

          print(f"Collection due: {should_collect} ({reason})")
          PY

      - name: Skip fresh snapshot
        if: steps.freshness.outputs.should_collect != 'true'
        shell: bash
        run: echo "Snapshot is fresh or outside the BRT collection window."

      - name: Install dependencies
        if: steps.freshness.outputs.should_collect == 'true'
        shell: bash
        working-directory: analytics
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate OAuth token exchange
        if: steps.freshness.outputs.should_collect == 'true'
        shell: bash
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import time

          import requests

          response = None
          last_error = None
          for attempt in range(1, 4):
              try:
                  response = requests.post(
                      "https://oauth2.googleapis.com/token",
                      data={
                          "client_id": os.environ["YT_CLIENT_ID"],
                          "client_secret": os.environ["YT_CLIENT_SECRET"],
                          "refresh_token": os.environ["YT_REFRESH_TOKEN"],
                          "grant_type": "refresh_token",
                      },
                      timeout=30,
                  )
                  if response.status_code == 200:
                      print("OAuth token exchange: OK")
                      raise SystemExit(0)
                  if response.status_code not in {408, 429, 500, 502, 503, 504}:
                      break
                  last_error = f"HTTP {response.status_code}"
              except requests.RequestException as exc:
                  last_error = type(exc).__name__

              if attempt < 3:
                  time.sleep(2 ** (attempt - 1))

          if response is not None:
              print(f"OAuth token exchange failed: HTTP {response.status_code}")
              try:
                  body = response.json()
                  print("Google error:", body.get("error"))
                  print("Description:", body.get("error_description"))
              except Exception:
                  print("Google returned a non-JSON error body.")
          elif last_error:
              print("OAuth token exchange failed:", last_error)
          raise SystemExit(1)
          PY

      - name: Collect analytics
        if: steps.freshness.outputs.should_collect == 'true'
        shell: bash
        working-directory: analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python collector/youtube_analytics_collector.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Collector attempt $attempt failed; retrying..."
              sleep $((attempt * 10))
            fi
          done
          echo "Collector failed after 3 attempts."
          exit 1

      - name: Validate generated snapshot
        if: steps.freshness.outputs.should_collect == 'true'
        shell: bash
        working-directory: analytics
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          latest = Path("latest.json")
          data = json.loads(latest.read_text(encoding="utf-8"))
          if data.get("schema_version") != 1:
              raise SystemExit("Unexpected snapshot schema version")
          if not data.get("channel", {}).get("id"):
              raise SystemExit("YouTube channel id is missing")
          if not isinstance(data.get("videos"), list):
              raise SystemExit("Snapshot videos field is invalid")

          raw_utc = data.get("collected_at_utc")
          raw_local = data.get("collected_at")
          if not raw_utc or not raw_local:
              raise SystemExit("Snapshot timestamps are missing")

          collected_utc = datetime.fromisoformat(raw_utc.replace("Z", "+00:00"))
          age_seconds = (datetime.now(timezone.utc) - collected_utc).total_seconds()
          if age_seconds < -60 or age_seconds > 300:
              raise SystemExit(f"Generated snapshot has invalid age: {age_seconds:.1f}s")

          collected_local = datetime.fromisoformat(raw_local)
          snapshot_path = (
              Path("snapshots")
              / collected_local.strftime("%Y/%m/%d")
              / f'{collected_local.strftime("%Y-%m-%dT%H-%M-%S%z")}.json'
          )
          if not snapshot_path.is_file():
              raise SystemExit(f"Historical snapshot was not created: {snapshot_path}")
          if snapshot_path.read_bytes() != latest.read_bytes():
              raise SystemExit("latest.json differs from historical snapshot")

          print(f"Snapshot validation: OK ({snapshot_path})")
          PY

      - name: Commit snapshot to private analytics repository
        if: steps.freshness.outputs.should_collect == 'true'
        shell: bash
        working-directory: analytics
        run: |
          set -euo pipefail
          git config user.name "boteco-rwx-analytics-bot"
          git config user.email "boteco-rwx-analytics-bot@users.noreply.github.com"
          git add latest.json snapshots/

          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi

          git commit -m "analytics: snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Snapshot push failed after 3 attempts."
          exit 1
