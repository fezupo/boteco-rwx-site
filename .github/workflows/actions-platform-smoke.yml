name: Public Actions Healthcheck

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/actions-platform-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove runner assignment
        shell: bash
        run: |
          echo "Public GitHub-hosted runner assigned successfully."
          uname -a
