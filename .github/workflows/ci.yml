name: site-ci

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: npm install

      - name: Type and Astro check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Carmack performance budget
        run: npm run budget

      - name: Upload static build artifact
        uses: actions/upload-artifact@v4
        with:
          name: boteco-rwx-site-static
          path: dist/
          if-no-files-found: error
          retention-days: 7
